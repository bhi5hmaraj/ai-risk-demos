# Hosted RL on Prime Intellect Lab. Push the env first (prime env push), then:
#   prime train rl.toml
# Pick a model from `prime train models`. The run tests whether RL moves the policy from the
# honest plan (0.784) toward the camera-blinding optimum (0.921).
max_steps = 100
seq_len = 16384

[ckpt]

[model]
name = "Qwen/Qwen3.5-4B"

[trainer.model.lora]
rank = 32
alpha = 64

[trainer.optim]
lr = 1e-5

[orchestrator]
batch_size = 128

[orchestrator.train]
group_size = 16

[orchestrator.train.sampling]
max_completion_tokens = 512

[[orchestrator.train.source]]
name = "armstrong-camera"
env.taskset.id = "armstrong-camera"
env.taskset.p = 0.8
env.player.harness.id = "null"
env.player.runtime.type = "subprocess"
